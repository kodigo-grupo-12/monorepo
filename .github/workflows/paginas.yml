# Publica la demo web de Cuéntame en GitHub Pages.
# Corre en cada verde de main que toque la app, y también a mano.
name: paginas-cuentame

on:
  push:
    branches: [main]
    paths:
      - "apps/cuentame/**"
      - ".github/workflows/paginas.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: paginas-cuentame
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pagina.outputs.page_url }}
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Escribir la config de Firebase
        run: |
          cat >> apps/cuentame/.env <<EOF
          EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID=${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EOF

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Exportar la web para Pages
        working-directory: apps/cuentame
        env:
          PAGES_DEPLOY: "1"
          PAGES_BASE_URL: /monorepo/
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
        run: npx expo export --platform web

      - name: Fallback de SPA para rutas profundas
        run: cp apps/cuentame/dist/index.html apps/cuentame/dist/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/cuentame/dist

      - id: pagina
        name: Publicar
        uses: actions/deploy-pages@v4

      - name: Verificar el despliegue
        run: |
          sleep 10
          for i in 1 2 3; do
            raiz=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.pagina.outputs.page_url }}")
            [ "$raiz" = 200 ] && break
            sleep 10
          done
          echo "GET / -> $raiz"
          test "$raiz" = 200
          spa=$(curl -s "${{ steps.pagina.outputs.page_url }}inicio")
          echo "$spa" | grep -q 'id="root"' && echo "GET /inicio -> SPA servida (fallback 404.html)"
          test "$spa" = "$(curl -s "${{ steps.pagina.outputs.page_url }}")"
