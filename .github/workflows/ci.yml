# Gate de CI en PRs: typecheck del paquete cuentame.
# Detecta en el PR lo que el export de Pages solo descubre después del
# merge (p. ej. un rename que deja un import sin resolver).
name: ci-pr

on:
  pull_request:
    paths:
      - "apps/cuentame/**"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter cuentame typecheck
